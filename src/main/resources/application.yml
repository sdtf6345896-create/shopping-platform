spring:
  application:
    name: shopping-platform
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate   # schema 一律交給 Flyway 管理,JPA 只驗證不自動建表
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 延遲載入的關聯(訂單明細、狀態歷程、SKU…)以 IN 查詢批次載入,避免列表頁 N+1
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-please-change-in-prod-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 小時
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}   # 14 天

app:
  security:
    login:
      max-attempts: 5    # 連續登入失敗幾次後鎖定
      lock-minutes: 15   # 鎖定時間
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    member-max-per-window: 20   # 會員每 10 分鐘最多上傳幾張圖
    member-window-minutes: 10
  mail:
    max-per-email-per-hour: 3   # 忘記密碼 / 重寄驗證信,同一信箱每小時上限
  shipping:
    fee: 60                  # 未達免運門檻的宅配運費
    cvs-fee: 45              # 未達免運門檻的超商取貨運費
    free-threshold: 999      # 商品金額(套用優惠券後)滿此金額免運
  points:
    earn-rate: 0.01          # 訂單完成回饋 1% 購物金(1 點 = NT$1)
    max-redeem-ratio: 0.5    # 單筆最多折抵應付金額的 50%
  birthday:
    reward-points: 100       # 生日當月贈送的購物金(0 = 關閉生日禮)
  referral:
    referrer-points: 100     # 被邀請的好友首筆訂單完成時,邀請人獲得的購物金
    referee-points: 50       # 同上,被邀請的新會員獲得的購物金
    min-order-amount: 300    # 首筆訂單商品金額(不含運費)需達此金額才發放
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}   # 線上付款期限,逾期自動取消(貨到付款不受限)
    expire-check-interval-ms: 60000                               # 逾期訂單掃描間隔
    auto-complete-days: 7                                         # 出貨幾天後未確認收貨自動完成
