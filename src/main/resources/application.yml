spring:
  application:
    name: shopping-platform
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate   # schema 一律交給 Flyway 管理,JPA 只驗證不自動建表
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-please-change-in-prod-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 小時
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}   # 14 天

app:
  security:
    login:
      max-attempts: 5    # 連續登入失敗幾次後鎖定
      lock-minutes: 15   # 鎖定時間
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}   # 線上付款期限,逾期自動取消(貨到付款不受限)
    expire-check-interval-ms: 60000                               # 逾期訂單掃描間隔
