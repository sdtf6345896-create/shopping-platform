# 一鍵啟動完整環境(MySQL + 後端 + 前端),不需要在本機安裝 Java / Node / MySQL:
#   docker compose up --build
# 前台:http://localhost:8081   後台:http://localhost:8081/admin(admin / admin123)
# Swagger:http://localhost:8080/swagger-ui.html
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: shopping_platform
      TZ: Asia/Taipei
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # dev profile 會灌入示範資料(管理員、示範會員、訂單)
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopping_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      SITE_BASE_URL: http://localhost:8081
      # 選填:設定後改用真的 SMTP 寄信,否則信件內容只會印在後端 log
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
  uploads:
