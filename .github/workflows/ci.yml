name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      # 用真的 MySQL 驗證 Flyway migration 與 entity 對應(MysqlMigrationIntegrationTest)
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopping_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MIGRATION_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/shopping_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&useSSL=false
      MIGRATION_TEST_DB_USERNAME: root
      MIGRATION_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for backend (migrations + demo data)
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/products > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready"
          exit 1

      - name: Frontend is served and proxies the API
        run: |
          curl -fs http://localhost:8081/ | grep -q 'id="app"'
          curl -fs http://localhost:8081/member/orders | grep -q 'id="app"'
          curl -fs http://localhost:8081/api/products | grep -q '"success":true'
          curl -fs -X POST http://localhost:8081/api/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | grep -q '"token"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
